name: plasma-core26-desktop
adopt-info: plasma-desktop
base: core26
summary: Runtime environment based on KDE Neon Core / Ubuntu 26.04
description: |
  The content snap providing the binaries of a Plasma Session for Ubuntu Core.

grade: stable
confinement: strict
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

environment:
  LD_LIBRARY_PATH: "/snap/kde-qt6-core26-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/snap/kde-qt6-core26-sdk/current/usr/lib:$SNAP/usr/lib:$SNAP/lib/:$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/usr/lib:/lib"

slots:
  plasma-core26:
    content: plasma-core26
    interface: content
    read: ["."]

parts:
  # Stage the locally-built core26 SDK snaps (kde-qt6-core26-sdk,
  # kf6-core26-sdk) into the part stage and expose them at their
  # canonical /snap/<name>/current paths inside the build container.
  # These SDKs are NOT in the Snap Store, so build-snaps: cannot
  # resolve them; the dump part replaces that mechanism.
  sdk-stage:
    plugin: dump
    source: .sdk/
    organize:
      '*': 'sdk-stage/'
    # The SDKs are build-time only; keep their staged content out of the
    # final snap (the /snap/<name>/current symlinks are what consumers use).
    prime:
      - -*
    override-stage: |
      craftctl default
      # craft-parts normalizes every staged .pc file, prepending the stage
      # dir to prefix= (e.g. /snap/kde-qt6-core26-sdk/current/usr ->
      # /root/stage/snap/kde-qt6-core26-sdk/current/usr). Mirror the
      # kf6-core-sdk pattern: symlink $CRAFT_STAGE/snap/<name>/current to
      # the staged SDK so those re-rooted paths resolve. Also expose the
      # canonical /snap/<name>/current paths for the hooks/build env.
      mkdir -p "$CRAFT_STAGE/snap/kde-qt6-core26-sdk" "$CRAFT_STAGE/snap/kf6-core26-sdk"
      ln -sfn "$CRAFT_STAGE/sdk-stage/kde-qt6-core26-sdk" "$CRAFT_STAGE/snap/kde-qt6-core26-sdk/current"
      ln -sfn "$CRAFT_STAGE/sdk-stage/kf6-core26-sdk" "$CRAFT_STAGE/snap/kf6-core26-sdk/current"
      mkdir -p /snap/kde-qt6-core26-sdk /snap/kf6-core26-sdk
      ln -sfn "$CRAFT_STAGE/sdk-stage/kde-qt6-core26-sdk" /snap/kde-qt6-core26-sdk/current
      ln -sfn "$CRAFT_STAGE/sdk-stage/kf6-core26-sdk" /snap/kf6-core26-sdk/current
  plasma-desktop:
    plugin: make
    source: .
    after:
      - sdk-stage
    build-packages:
      - ccache
      - cmake
      - gcc-14
      - g++-14
      - git
      - libavcodec-dev
      - libavfilter-dev
      - libavformat-dev
      - libboost-all-dev
      - libcanberra-dev
      - libcanberra-pulse
      - libdbus-1-dev
      - libdisplay-info-dev
      - libdrm-dev
      - libevdev-dev
      - libfreetype-dev
      - libgcrypt20-dev
      - libgl-dev
      - libglvnd-dev
      - libglib2.0-dev
      - libio-socket-ssl-perl
      - libjson-xs-perl
      - liblcms2-dev
      - libnm-dev
      - libpam0g-dev
      - libpipewire-0.3-dev
      - libproxy-dev
      - libqalculate-dev
      - libssh-dev
      - libsensors-dev
      - libsm-dev
      - libsystemd-dev
      - libudev-dev
      - liburi-perl
      - libwacom-dev
      - libx11-xcb-dev
      - libxcb-composite0-dev
      - libxcb-damage0-dev
      - libxcb-shape0-dev
      - libxcb-xfixes0-dev
      - libxcvt-dev
      - libxkbcommon-dev
      - libxkbregistry-dev
      - libxslt1.1
      - libyaml-libyaml-perl
      - modemmanager-dev
      - ninja-build
      - shellcheck
      - systemd-dev
      - xorg-dev
      - xserver-xorg-dev
      - xserver-xorg-input-libinput-dev
      - xserver-xorg-input-wacom
    stage-packages:
      # Breeze's look-and-feel defaults set cursorTheme=breeze_cursors
      # (kcminputrc), and kwin's cursor-theme fallback chain also ends at
      # the literal name "breeze_cursors" (Cursor::fallbackThemeName()),
      # but the "breeze" kde-projects module is deliberately excluded from
      # the kdesrc-build source build above (see ignore-modules) since
      # Ubuntu already packages its theme assets. Nothing was staging the
      # actual breeze-cursor-theme deb though, so every cursor-theme
      # lookup failed and the pointer was invisible everywhere. Same class
      # of bug as the missing "Next" wallpaper fixed in
      # tools/patch-kdesrc-sources.py.
      - breeze-cursor-theme
      - libavcodec62
      - libavfilter11
      - libavformat62
      - libcanberra-pulse
      - libdisplay-info3
      - libdrm2
      - libevdev2
      - libfreetype6
      - libgbm1
      - libgcrypt20
      - libglib2.0-0t64
      - liblcms2-2
      - libmm-glib0
      - libnm0
      - libpam0g
      - libpipewire-0.3-0t64
      - libproxy1v5
      - libqalculate23
      - libssh-4
      - libsensors5
      - libsystemd0
      - libudev1
      - libwacom9
      - libwayland-cursor0
      - libwayland-egl1
      - libxcb-cursor0
      - libxcvt0
      - libxkbcommon0
      - libxkbregistry0
      - xserver-xorg-input-libinput
      - xserver-xorg-input-wacom
      - xwayland
    build-environment:
      - CCACHE_DIR: ${SNAPCRAFT_PROJECT_DIR}/.ccache
      - CCACHE_NOHASHDIR: "true"
      - PATH: /usr/lib/ccache:/snap/kde-qt6-core26-sdk/current/usr/bin:/snap/kde-qt6-core26-sdk/current/usr/bin/qt6:/snap/kf6-core26-sdk/current/usr/bin:${PATH:+:$PATH}
      - PKG_CONFIG_PATH: $CRAFT_PART_INSTALL/usr/share/pkgconfig:$CRAFT_PART_INSTALL/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pkgconfig:/snap/kde-qt6-core26-sdk/current/usr/share/pkgconfig:/snap/kde-qt6-core26-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pkgconfig:/snap/kf6-core26-sdk/current/usr/share/pkgconfig:/snap/kf6-core26-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
      - XDG_DATA_DIRS: $CRAFT_PART_INSTALL/usr/share:/snap/kde-qt6-core26-sdk/current/usr/share:/snap/kf6-core26-sdk/current/usr/share:/usr/share${XDG_DATA_DIRS:+:$XDG_DATA_DIRS}
      - XDG_CONFIG_DIRS: $CRAFT_PART_INSTALL/etc/xdg:/snap/kde-qt6-core26-sdk/current/etc/xdg:/snap/kf6-core26-sdk/current/etc/xdg:/etc/xdg${XDG_CONFIG_DIRS:+:$XDG_CONFIG_DIRS}
      - LD_LIBRARY_PATH: "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$CRAFT_PART_INSTALL/usr/lib:$CRAFT_PART_INSTALL/lib/:/snap/kde-qt6-core26-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/snap/kde-qt6-core26-sdk/current/usr/lib:/snap/kf6-core26-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/snap/kf6-core26-sdk/current/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      - CMAKE_PREFIX_PATH: $CRAFT_PART_INSTALL/usr:/snap/kde-qt6-core26-sdk/current/usr:/snap/kf6-core26-sdk/current/usr${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}
      - QML2_IMPORT_PATH: $CRAFT_PART_INSTALL/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/qml:$CRAFT_PART_INSTALL/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/qt6/qml:/snap/kf6-core26-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/qml:/snap/kf6-core26-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/qt6/qml:/snap/kde-qt6-core26-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/qml:/snap/kde-qt6-core26-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/qt6/qml${QML2_IMPORT_PATH:+:$QML2_IMPORT_PATH}
    override-pull: |
      craftctl set version="$(/bin/date +%Y%m%d)"
      # A previous failed build leaves the KF6 SDK QML module symlinks
      # (and kdesrc-build's log/latest/* symlinks) under the part install
      # dir. snapcraft's make plugin scans for symlinks to copy during the
      # pull phase and chokes (IsADirectoryError) on directory symlinks.
      # Clean them up here, before that scan runs.
      PART_INSTALL="${CRAFT_PART_INSTALL:-/root/parts/plasma-desktop/install}"
      rm -rf "$PART_INSTALL"/install-data/kde/src/log
      find "$PART_INSTALL"/usr/lib -path "*/qml/*" -type l -delete 2>/dev/null || true
      craftctl default
    override-build: |
      # CCACHE_DIR is set via build-environment to a host-persistent
      # path (${SNAPCRAFT_PROJECT_DIR}/.ccache) so the cache survives
      # `snapcraft clean` and accelerates the kdesrc-build C++ rebuilds.
      # (A hardcoded /root/.ccache lives inside the LXD container and is
      # wiped by snapcraft clean, defeating the cache.) PATH already
      # includes /usr/lib/ccache via build-environment, so the ccache
      # shim is picked up automatically by the cmake launcher config in
      # hooks/000-setup-kdesrc-build.sh.
      # A previous failed build can leave kdesrc-build's per-module log
      # dir (with log/latest/* directory symlinks) and the KF6 SDK QML
      # module symlinks under the part install dir. snapcraft's make
      # plugin later scans for symlinks to copy and chokes
      # (IsADirectoryError) on those. Drop them before building.
      # $CRAFT_PART_INSTALL is not reliably exported into this script, so
      # fall back to the known part install path.
      PART_INSTALL="${CRAFT_PART_INSTALL:-/root/parts/plasma-desktop/install}"
      rm -rf "$PART_INSTALL"/install-data/kde/src/log
      find "$PART_INSTALL"/usr/lib -path "*/qml/*" -type l -delete 2>/dev/null || true
      craftctl default
    override-prime: |
      craftctl default
      # craft-parts' incremental stage->prime sync copies new/changed files
      # but does NOT delete files that disappeared from stage/part-install,
      # so service files removed by hooks/200 in a previous build can
      # survive as stale copies in the prime dir. Remove them explicitly
      # here to guarantee prime is clean regardless of stale state.
      for s in dconf drkonqi-coredump-cleanup drkonqi-coredump-launcher@ \
        drkonqi-coredump-pickup drkonqi-sentry-postman glib-pacrunner \
        plasma-baloorunner plasma-dolphin plasma-kaccess plasma-knighttimed \
        plasma-kscreen-osd plasma-kscreen plasma-kwallet-pam plasma-kwin_x11 \
        plasma-startupsound plasma-xdg-desktop-portal-kde session-migration \
        user-session-migration; do
        rm -f "$SNAPCRAFT_PRIME/usr/lib/systemd/user/$s.service"
      done
      for i in `dpkg -L pipewire pipewire-pulse | grep -v "^/\.$" | sed -E -e 's,^/,,' | tac` ; do (rm -df "$SNAPCRAFT_PRIME/$i" || /bin/true) ; done
      for i in `dpkg -L pipewire-bin | grep -v "^/\.$" | grep -v "usr/share" | sed -E -e 's,^/,,' | tac` ; do (rm -df "$SNAPCRAFT_PRIME/$i" || /bin/true) ; done
      cd ${CRAFT_PART_SRC} && make test TESTDIR=${CRAFT_PRIME}
