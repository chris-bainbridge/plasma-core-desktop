name: plasma-core26-desktop
adopt-info: plasma-debs
base: core26
summary: Runtime environment based on KDE Neon Core / Ubuntu 26.04
description: |
  The content snap providing the binaries of a Plasma Session for Ubuntu Core.

  Since the deb-repack conversion this snap stages runtime packages from
  the KDE Neon unstable/resolute apt suite (the same version train the
  previous kdesrc-build source build produced: Qt 6.11.1 / KF6 6.30 /
  Plasma 6.7.5) instead of compiling Plasma from source. The package set
  was derived by mapping the file inventory of the last from-source
  build onto the suite's Contents index, so it stages exactly what the
  source build used to install. KF6/Qt runtime libraries are pruned at
  stage time -- the kf6-core26 content snap provides them at runtime
  (same split the source build had).

grade: stable
confinement: strict
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

# arm64 dropped on this branch: Neon's unstable/resolute suite has
# incomplete arm64 coverage (no kwin/plasma binaries). The desktop/26
# from-source branch keeps arm64.

environment:
  LD_LIBRARY_PATH: "$SNAP/usr/lib:$SNAP/lib/:$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/usr/lib:/lib"

slots:
  plasma-core26:
    content: plasma-core26
    interface: content
    read: ["."]

package-repositories:
-   type: apt
    components:
    - main
    suites:
    - resolute
    key-id: 444DABCF3667D0283F894EDDE6D4736255751E5D
    key-server: keyserver.ubuntu.com
    url: http://origin.archive.neon.kde.org/unstable

parts:
  plasma-debs:
    plugin: nil
    build-packages:
      # make/test for hook-tests; pipewire trio so the override-prime
      # `dpkg -L` prune resolves exactly as it did in the source build
      - make
      - pipewire
      - pipewire-pulse
      - pipewire-bin
    # Unpinned on purpose: floating tracks Neon latest so security fixes
    # arrive automatically; the image build snapshots whatever the suite
    # had at build time. A temporary `=` pin is the emergency brake if a
    # Neon rollout breaks this build. go-build-kde checks the resolved
    # Qt/KF6 versions against kf6-core26 to catch cross-snap skew.
    #
    # The Neon portion was derived by mapping the last source-built
    # snap's inventory onto the Neon suite's Contents index; the resolute
    # portion carries over the system-library stage-packages the source
    # build used. Discover is deliberately NOT staged (the source build
    # ignored it too); xwaylandvideobridge is dropped (Neon doesn't
    # package it).
    stage-packages:
      - bluedevil
      - breeze-cursor-theme
      - dolphin
      - drkonqi
      - kactivitymanagerd
      - kde-cli-tools
      - kde-cli-tools-data
      - kde-config-sddm
      - kdeplasma-addons-data
      - kglobalacceld
      - kinfocenter
      - kmenuedit
      - knighttime
      - konsole
      - konsole-kpart
      - kscreen
      - kscreenlocker
      - ksshaskpass
      - ksystemstats
      - kwayland
      - kwin-addons
      - kwin-common
      - kwin-wayland
      - kwrited
      - libavcodec62
      - libavfilter11
      - libavformat62
      - libcanberra-pulse
      - libdisplay-info3
      - libdolphinvcs6
      - libdrm2
      - libdrm-amdgpu1
      - libdrm-intel1
      - libei1
      - libevdev2
      - libfreetype6
      - libgbm1
      - libgcrypt20
      - libglib2.0-0t64
      - libkdecorations3-6
      - libkdecorations3private2
      - libkf6pulseaudioqt5
      - libkf6screen8
      - libkf6screen-bin
      - libkf6screendpms8
      - libkpipewire6
      - libkpipewirerecord6
      - libksysguard
      - liblayershellqtinterface6
      - liblcms2-2
      - libmm-glib0
      - libnm0
      - liboeffis1
      - libpam0g
      - libpam-kwallet5
      - libpam-kwallet-common
      - libpipewire-0.3-0t64
      - libplasma6
      - libpowerdevilcore2
      - libproxy1v5
      - libqalculate23
      - libsensors5
      - libsnapd-glib-2-1
      - libssh-4
      - libsystemd0
      - libudev1
      - libwacom9
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxcb-cursor0
      - libxcvt0
      - libxkbcommon0
      - libxkbregistry0
      - milou
      - ocean-sound-theme
      - plasma5support
      - plasma-activities
      - plasma-activities-stats
      - plasma-dataengines-addons
      - plasma-desktop
      - plasma-integration
      - plasma-nm
      - plasma-pa
      - plasma-systemmonitor
      - plasma-thunderbolt
      - plasma-vault
      - plasma-wallpapers-addons
      - plasma-welcome
      - plasma-widgets-addons
      - plasma-workspace
      - plasma-workspace-wallpapers
      - polkit-kde-agent-1
      - powerdevil
      - powerdevil-data
      - systemsettings
      - xdg-desktop-portal-kde
      - xserver-xorg-input-libinput
      - xwayland
      # The MIME database: without it ksycoca is built with no service
      # types ("Service type not found: inode/directory" spam, KService
      # lookups fail). A Neon/Kubuntu desktop install gets it via the
      # distro closure; the deb closure here only carries two stray mime
      # files, so it is staged explicitly (distro-faithful, not a
      # substitute).
      - shared-mime-info
    override-pull: |
      # craft injects http_proxy into the process env, but python-apt's
      # fetch methods ignore the env and read apt.conf only -- without
      # this file the deb downloads bypass the caching proxy entirely.
      # On CI there is no http_proxy env and apt goes direct.
      if [ -n "${http_proxy:-}" ]; then
          printf 'Acquire::http::Proxy "%s";\n' "$http_proxy" \
              > /etc/apt/apt.conf.d/95proxy
      fi
      craftctl set version="$(/bin/date +%Y%m%d)-deb"
      craftctl default
    override-prime: |
      craftctl default
      # NOTE: all tree modifications (hooks, prune) happen HERE, on the
      # primed tree, AFTER craftctl default, NOT in override-stage. craft's
      # prime step replays the stage layer manifest and fails
      # (FileNotFoundError) on any path deleted from the stage after
      # staging; modifying $SNAPCRAFT_PRIME after craftctl default is the
      # safe point (and mirrors the old build, whose hooks ran via
      # `make install DESTDIR` on the tree that became the prime). Hooks
      # expect cwd = tree root and use relative paths; they run in basename
      # order like the Makefile's install target did. Hook temp copies live
      # in /tmp so they never land in the snap.
      #
      # Vendor in the plasma-*.target units first: Neon's 6.7.5 debs (and
      # the whole release/resolute suite) ship NO plasma-*.target files
      # (a Neon packaging gap -- Ubuntu's own resolute plasma-workspace
      # 6.6.6 deb does ship them; vendored from there). Hook 200 rewires
      # them to the session snap's units exactly as the source build's
      # kdesrc-install targets were rewired.
      mkdir -p "$SNAPCRAFT_PRIME/usr/lib/systemd/user"
      cp "$CRAFT_PROJECT_DIR"/vendor/systemd-user-targets/*.target \
         "$SNAPCRAFT_PRIME/usr/lib/systemd/user/"
      for f in "$CRAFT_PROJECT_DIR"/hooks/[0-9]*.sh; do
          base="$(basename "$f")"
          cp "$f" "/tmp/.hook-$base"
          (cd "$SNAPCRAFT_PRIME" && bash "/tmp/.hook-$base")
          rm -f "/tmp/.hook-$base"
      done

      # Prune the dependency closure that kf6-core26 provides at runtime
      # (KF6/Qt runtime libs, QML modules, plugins), so this snap carries
      # only Plasma content -- the split the source build had (its prime
      # never contained KF6/Qt; hook 999 only had to clean build-time QML
      # copies). Ownership-based: only files/symlinks listed in debs whose
      # package name is in tools/kf6-provided-packages.txt are removed;
      # directories are never removed wholesale (a dir like
      # usr/lib/<triplet> is listed by many packages), empty dirs are
      # cleaned up afterwards. This must run AFTER the hooks: hook 400
      # moves kwallet.portal out of portals/, so the moved copy survives
      # the prune of the kf6-kwallet deb's own paths.
      provided="$CRAFT_PROJECT_DIR/tools/kf6-provided-packages.txt"
      debdir=""
      for cand in /root/parts/plasma-debs/stage_packages \
                  "$CRAFT_PART_INSTALL/../stage_packages"; do
          [ -d "$cand" ] && debdir="$cand" && break
      done
      if [ -z "$debdir" ]; then
          echo "WARNING: stage_packages dir not found; skipping provided-elsewhere prune" >&2
      else
          for deb in "$debdir"/*.deb; do
              pkg="$(dpkg-deb -f "$deb" Package)"
              grep -qxF "$pkg" "$provided" || continue
              dpkg-deb -c "$deb" | awk '
                  $1 ~ /^d/ { next }
                  {
                      line = $0
                      sub(/ -> .*$/, "", line)
                      sub(/^[^ ]+ +[^ ]+ +[^ ]+ +[^ ]+ +[^ ]+ +/, "", line)
                      sub(/^\.\//, "", line)
                      if (line != "") print line
                  }' | while IFS= read -r p; do
                  rm -f "$SNAPCRAFT_PRIME/$p" 2>/dev/null || true
              done
          done
          find "$SNAPCRAFT_PRIME/usr" -mindepth 2 -type d -empty -delete 2>/dev/null || true
      fi

      # Record the resolved Neon/resolute deb set (name + version) inside
      # the snap. go-build-kde compares this manifest between
      # plasma-core26-desktop and kf6-core26 to catch Qt/KF6 version skew
      # from rebuilding one content snap without the other.
      mkdir -p "$SNAPCRAFT_PRIME/meta"
      : > "$SNAPCRAFT_PRIME/meta/pkg-manifest.txt"
      for deb in /root/parts/plasma-debs/stage_packages/*.deb \
                 "$CRAFT_PART_INSTALL/../stage_packages"/*.deb; do
          [ -e "$deb" ] || continue
          dpkg-deb -f "$deb" Package Version \
              | paste - - | sed 's/^Package: //; s/\tVersion: / /' \
              >> "$SNAPCRAFT_PRIME/meta/pkg-manifest.txt"
      done
      sort -u -o "$SNAPCRAFT_PRIME/meta/pkg-manifest.txt" "$SNAPCRAFT_PRIME/meta/pkg-manifest.txt"

      # craft-parts' incremental stage->prime sync copies new/changed files
      # but does NOT delete files that disappeared from stage/part-install,
      # so service files removed by hooks/200 in a previous build can
      # survive as stale copies in the prime dir. Remove them explicitly
      # here to guarantee prime is clean regardless of stale state.
      for s in dconf drkonqi-coredump-cleanup drkonqi-coredump-launcher@ \
        drkonqi-coredump-pickup drkonqi-sentry-postman glib-pacrunner \
        plasma-baloorunner plasma-dolphin plasma-kaccess plasma-knighttimed \
        plasma-kscreen-osd plasma-kscreen plasma-kwallet-pam plasma-kwin_x11 \
        plasma-startupsound plasma-xdg-desktop-portal-kde session-migration \
        user-session-migration; do
        rm -f "$SNAPCRAFT_PRIME/usr/lib/systemd/user/$s.service"
      done
      for unit in drkonqi-sentry-postman.path drkonqi-sentry-postman.timer; do
        rm -f "$SNAPCRAFT_PRIME/usr/lib/systemd/user/$unit"
        find "$SNAPCRAFT_PRIME/usr/lib/systemd/user" -type l -name "$unit" -delete
      done
      for i in `dpkg -L pipewire pipewire-pulse | grep -v "^/\.$" | sed -E -e 's,^/,,' | tac` ; do (rm -df "$SNAPCRAFT_PRIME/$i" || /bin/true) ; done
      for i in `dpkg -L pipewire-bin | grep -v "^/\.$" | grep -v "usr/share" | sed -E -e 's,^/,,' | tac` ; do (rm -df "$SNAPCRAFT_PRIME/$i" || /bin/true) ; done
      cd "$CRAFT_PROJECT_DIR" && make test TESTDIR="$SNAPCRAFT_PRIME"
